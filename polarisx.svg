<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 250" width="480" height="250" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
<style>
.s{animation-name:tw;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
.sp{animation-name:sp;animation-iteration-count:infinite;animation-timing-function:ease-in-out;transform-box:fill-box;transform-origin:center}
@keyframes tw{0%,100%{opacity:.12}50%{opacity:1}}
@keyframes sp{0%,100%{opacity:.1;transform:scale(.4)}50%{opacity:1;transform:scale(1.15)}}
.shoot{opacity:0;animation-name:shoot;animation-iteration-count:infinite;animation-timing-function:ease-out}
@keyframes shoot{0%{transform:translate(0,0);opacity:0}2%{opacity:1}14%{transform:translate(340px,170px);opacity:0}100%{transform:translate(340px,170px);opacity:0}}
.spin{animation:spin 26s linear infinite}
.spin2{animation:spin 14s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.fade{opacity:0;animation:fade 1.4s ease-out forwards}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.glow{animation:glow 5s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:.95}}
.drift{animation:drift 18s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(14px,-8px)}}
.dash{stroke-dasharray:6 10;animation:dash 3s linear infinite}
@keyframes dash{to{stroke-dashoffset:-32}}
</style>
