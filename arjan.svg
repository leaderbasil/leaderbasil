<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#02040c"/><stop offset=".55" stop-color="#06112a"/><stop offset="1" stop-color="#0a2150"/></linearGradient>
<radialGradient id="neb1" cx=".78" cy=".35" r=".55"><stop offset="0" stop-color="#1E90FF" stop-opacity=".38"/><stop offset="1" stop-color="#1E90FF" stop-opacity="0"/></radialGradient>
<radialGradient id="neb2" cx=".12" cy=".95" r=".5"><stop offset="0" stop-color="#6a4cff" stop-opacity=".22"/><stop offset="1" stop-color="#6a4cff" stop-opacity="0"/></radialGradient>
<linearGradient id="nm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#9ad0ff"/><stop offset="1" stop-color="#1E90FF"/></linearGradient>
<linearGradient id="tail" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".95"/></linearGradient>
<radialGradient id="planet" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#7cc4ff"/><stop offset=".55" stop-color="#1E90FF"/><stop offset="1" stop-color="#0a2f77"/></radialGradient>
<linearGradient id="bord" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1E90FF" stop-opacity=".9"/><stop offset="1" stop-color="#6a4cff" stop-opacity=".5"/></linearGradient>
<filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
