<text x="36" y="92" font-size="38" font-weight="800" fill="url(#nm)" letter-spacing="2">RIPPLE</text>
<text x="36" y="126" font-size="14.5" fill="#b3c6e6">An incremental build analysis engine in C++. Given an edited file,</text>
<text x="36" y="148" font-size="14.5" fill="#b3c6e6">it finds exactly which files must rebuild and in what order, using content</text>
<text x="36" y="170" font-size="14.5" fill="#b3c6e6">hashing, an include graph, impact traversal, and Kahn's algorithm.</text>
<rect x="36" y="196" width="51" height="30" rx="15" fill="#1E90FF" stroke="#1E90FF" stroke-opacity=".55" fill-opacity=".14"/><text x="61" y="216" font-size="13" fill="#d6e8ff" text-anchor="middle" font-weight="600">C++</text><rect x="95" y="196" width="157" height="30" rx="15" fill="#1E90FF" stroke="#1E90FF" stroke-opacity=".55" fill-opacity=".14"/><text x="173" y="216" font-size="13" fill="#d6e8ff" text-anchor="middle" font-weight="600">Graph algorithms</text><rect x="260" y="196" width="133" height="30" rx="15" fill="#1E90FF" stroke="#1E90FF" stroke-opacity=".55" fill-opacity=".14"/><text x="326" y="216" font-size="13" fill="#d6e8ff" text-anchor="middle" font-weight="600">Kahn ordering</text><rect x="400" y="196" width="75" height="30" rx="15" fill="#1E90FF" stroke="#1E90FF" stroke-opacity=".55" fill-opacity=".14"/><text x="438" y="216" font-size="13" fill="#d6e8ff" text-anchor="middle" font-weight="600">FNV-1a</text><text x="964" y="48" font-size="13" fill="#8cc8ff" text-anchor="end" font-weight="600">View repository →</text>
